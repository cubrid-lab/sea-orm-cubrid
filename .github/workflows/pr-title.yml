name: Check PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash merges use the PR title as the commit subject on main, and
      # Release Please derives the next version and CHANGELOG from it.
      # Optional lowercase scopes such as docs(readme): stay allowed.
      # chore(deps) and chore(main) are generated by Dependabot and Release Please.
      - name: Require the Conventional Commits title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'type: description' or 'type(scope): description'. Got: $TITLE"
            exit 1
          fi
